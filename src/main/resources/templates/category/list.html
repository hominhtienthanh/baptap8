<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Danh sách Category</title></head>
<body>
<main layout:fragment="content">
    <h2>📂 Danh sách Category</h2>
    <form method="get" th:action="@{/categories}">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm..."/>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <a class="btn btn-success mt-2" th:href="@{/categories/new}">➕ Thêm</a>
    <table class="table table-bordered mt-2">
        <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Mô tả</th>
            <th>Action</th>
        </tr>
        <tr th:each="c : ${categories}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.description}"></td>
            <td>
                <a th:href="@{'/categories/edit/' + ${c.id}}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{'/categories/delete/' + ${c.id}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Xóa?')">Delete</a>
            </td>
        </tr>
    </table>

    <div>
        <span th:each="i : ${#numbers.sequence(0, totalPages-1)}">
            <a th:href="@{'/categories?(page=' + ${i} + '&keyword=' + ${keyword})}"
               th:text="${i+1}"
               th:classappend="${i==currentPage}? 'fw-bold text-danger' : ''">Page</a>
        </span>
    </div>
</main>
</body>
</html>
